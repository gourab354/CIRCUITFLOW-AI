[package]
name = "circuitflow-ai-desktop"
version = "1.0.0"
description = "CircuitFlow AI - Desktop PCB Design & Engineering Application"
authors = ["CircuitFlow AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "fs-all", "http-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
